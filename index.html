<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Shogl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="text-white">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-4xl font-bold text-center my-8 text-blue-400">Social Shogl</h1>
        
        <div class="bg-slate-800 p-6 rounded-lg mb-6 shadow-lg">
            <h2 class="text-2xl mb-4">أضف خدمة جديدة</h2>
            <input id="title" placeholder="اسم الخدمة" class="w-full p-3 mb-3 bg-slate-700 rounded text-white border border-slate-600 focus:border-blue-500 outline-none">
            <input id="price" placeholder="السعر" type="number" class="w-full p-3 mb-3 bg-slate-700 rounded text-white border border-slate-600 focus:border-blue-500 outline-none">
            <textarea id="desc" placeholder="الوصف" rows="3" class="w-full p-3 mb-3 bg-slate-700 rounded text-white border border-slate-600 focus:border-blue-500 outline-none"></textarea>
            <button onclick="addService()" id="addBtn" class="bg-blue-600 px-6 py-2 rounded hover:bg-blue-700 transition">إضافة</button>
        </div>

        <div id="loading" class="text-center text-xl py-8">جاري التحميل...</div>
        <div id="services" class="grid gap-4"></div>
    </div>

    <script>
        const BIN_ID = '6b04a26fac6210605a9ee65d';
        const API_KEY = '$2a$10$69IXxvfTlGFiMhsBHxm1.Ojjkl0CgrN62ssNv0GJ6ZxTaA8uFx6oC';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        async function loadServices() {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const services = data.record.services || [];
                
                const container = document.getElementById('services');
                if (services.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-400 py-8">مفيش خدمات لسه. ضيف أول خدمة!</p>';
                } else {
                    container.innerHTML = services.map((s, i) => `
                        <div class="bg-slate-800 p-5 rounded-lg shadow-lg">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <h3 class="text-xl font-bold text-blue-400 mb-2">${s.title}</h3>
                                    <p class="text-gray-300 mb-3">${s.desc}</p>
                                    <p class="text-green-400 font-bold text-lg">${s.price} جنيه</p>
                                </div>
                                <button onclick="deleteService(${i})" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700 transition mr-3">حذف</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('services').innerHTML = '<p class="text-center text-red-400 py-8">في مشكلة في تحميل البيانات. اتأكد من النت</p>';
            }
            document.getElementById('loading').style.display = 'none';
        }

        async function addService() {
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value.trim();
            const desc = document.getElementById('desc').value.trim();
            
            if (!title || !price) {
                alert('اكتب اسم الخدمة والسعر على الأقل');
                return;
            }

            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerText = 'جاري الإضافة...';

            try {
                const res = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const services = data.record.services || [];
                
                services.push({ title, price, desc });
                
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ services })
                });

                document.getElementById('title').value = '';
                document.getElementById('price').value = '';
                document.getElementById('desc').value = '';
                await loadServices();
            } catch (err) {
                alert('في مشكلة في الإضافة. جرب تاني');
                console.error(err);
            }
            
            btn.disabled = false;
            btn.innerText = 'إضافة';
        }

        async function deleteService(i) {
            if (!confirm('متأكد عايز تمسح الخدمة دي؟')) return;
            
            try {
                const res = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const services = data.record.services || [];
                
                services.splice(i, 1);
                
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ services })
                });
                
                await loadServices();
            } catch (err) {
                alert('في مشكلة في الحذف');
                console.error(err);
            }
        }

        // حمل الخدمات أول ما الصفحة تفتح
        loadServices();
    </script>
</body>
</html>
