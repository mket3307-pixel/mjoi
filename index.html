<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Shogl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-4xl font-bold text-center my-8 text-blue-400">Social Shogl</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-2xl mb-4">أضف خدمة جديدة</h2>
            <input id="title" placeholder="اسم الخدمة" class="w-full p-2 mb-3 bg-gray-700 rounded">
            <input id="price" placeholder="السعر" class="w-full p-2 mb-3 bg-gray-700 rounded">
            <textarea id="desc" placeholder="الوصف" class="w-full p-2 mb-3 bg-gray-700 rounded"></textarea>
            <button onclick="addService()" class="bg-blue-600 px-6 py-2 rounded hover:bg-blue-700">إضافة</button>
        </div>

        <div id="services" class="grid gap-4"></div>
    </div>

    <script>
        function loadServices() {
            const services = JSON.parse(localStorage.getItem('services') || '[]');
            const container = document.getElementById('services');
            container.innerHTML = services.map((s, i) => `
                <div class="bg-gray-800 p-4 rounded-lg">
                    <h3 class="text-xl font-bold text-blue-400">${s.title}</h3>
                    <p class="my-2">${s.desc}</p>
                    <p class="text-green-400 font-bold">${s.price} جنيه</p>
                    <button onclick="deleteService(${i})" class="bg-red-600 px-4 py-1 rounded mt-2">حذف</button>
                </div>
            `).join('');
        }

        function addService() {
            const services = JSON.parse(localStorage.getItem('services') || '[]');
            services.push({
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                desc: document.getElementById('desc').value
            });
            localStorage.setItem('services', JSON.stringify(services));
            loadServices();
            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('desc').value = '';
        }

        function deleteService(i) {
            const services = JSON.parse(localStorage.getItem('services') || '[]');
            services.splice(i, 1);
            localStorage.setItem('services', JSON.stringify(services));
            loadServices();
        }

        loadServices();
    </script>
</body>
</html>
